# Simulation harness infra (Postgres + MinIO) for `simtest`.
# Ports are offset from the integration test compose (5434/9002) so both can
# run side-by-side without clashing. Container names are set explicitly so the
# chaos injector can reference them with `docker pause`.
services:
  postgres:
    image: postgres:16
    container_name: simtest-postgres
    environment:
      POSTGRES_PASSWORD: test
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=8
        -c max_wal_senders=8
        -c max_wal_size=2GB
        -c shared_buffers=256MB
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: simtest-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - simtest-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10

  createbucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/streambed --ignore-existing;
      exit 0;
      "

volumes:
  simtest-minio-data:
