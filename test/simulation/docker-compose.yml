# Simulation harness infra (Postgres + MinIO) for `simtest`.
# Ports are offset from the integration test compose (5434/9002) so both can
# run side-by-side without clashing. Container names are set explicitly so the
# chaos injector can reference them with `docker pause`.
services:
  postgres:
    image: postgres:16
    container_name: simtest-postgres
    environment:
      POSTGRES_PASSWORD: test
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=8
        -c max_wal_senders=8
        -c max_wal_size=2GB
        -c shared_buffers=256MB
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  minio:
    # Multi-arch Silo release pinned to its manifest-list digest.
    # See docs/integration-test-images.md for the update process.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: simtest-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - simtest-minio-data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/silo", "healthcheck", "ready"]
      interval: 2s
      timeout: 5s
      retries: 10

  createbucket:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mcli alias set local http://minio:9000 minioadmin minioadmin;
      mcli mb local/streambed --ignore-existing;
      exit 0;
      "

volumes:
  simtest-minio-data:
