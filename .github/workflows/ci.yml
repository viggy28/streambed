name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'site/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'site/**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o streambed ./cmd/streambed

      - name: Unit tests
        run: go test -race ./internal/... ./config/... ./demo/hn/...

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag streambed:test .

      - name: Smoke test image
        run: |
          docker run --rm streambed:test --help
          test "$(docker run --rm --entrypoint id streambed:test -u)" != "0"

  hn-demo-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/hn/cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/hn/cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Type-check and validate deployment
        run: npm run check

      - name: Browser tests
        run: npm run test:e2e

  integration-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start services
        run: |
          docker compose -f test/integration/docker-compose.yml up -d postgres minio --wait
          docker compose -f test/integration/docker-compose.yml up createbucket

      - name: Integration smoke tests
        run: >
          go test -tags integration -short -v -timeout 8m
          -run 'TestEndToEnd$|TestEndToEndUpdateDelete$|TestSchemaEvolution_AddColumn$|TestMutationModesDuckDBCorrectness/cow$|TestCDCDataIntegrityOracle$'
          ./test/integration

      - name: Query compatibility oracle
        run: go test -tags integration -v -timeout 10m ./test/querycompat

      - name: Stop services
        if: always()
        run: docker compose -f test/integration/docker-compose.yml down -v

  integration-full:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start services
        run: |
          docker compose -f test/integration/docker-compose.yml up -d postgres minio --wait
          docker compose -f test/integration/docker-compose.yml up createbucket

      - name: Full integration tests
        run: go test -tags integration -short -v -timeout 30m ./test/integration/...

      - name: Query compatibility oracle
        run: go test -tags integration -v -timeout 10m ./test/querycompat

      - name: Stop services
        if: always()
        run: docker compose -f test/integration/docker-compose.yml down -v

  integration-expensive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start services
        run: |
          docker compose -f test/integration/docker-compose.yml up -d postgres minio --wait
          docker compose -f test/integration/docker-compose.yml up createbucket

      - name: Expensive integration tests
        run: go test -tags integration -v -timeout 60m ./test/integration/...

      - name: Stop services
        if: always()
        run: docker compose -f test/integration/docker-compose.yml down -v
