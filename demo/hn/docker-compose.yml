services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    ports:
      - "55432:5432"
    volumes:
      - hn-postgres:/var/lib/postgresql/data
      - ./ingester/schema.sql:/docker-entrypoint-initdb.d/001-hn.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hn"]
      interval: 2s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - hn-minio:/data
    healthcheck:
      test: ["CMD", "/usr/bin/silo", "healthcheck", "ready"]
      interval: 2s
      timeout: 5s
      retries: 10

  createbucket:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mcli alias set local http://minio:9000 minioadmin minioadmin;
      mcli mb local/streambed --ignore-existing;
      "

volumes:
  hn-postgres:
  hn-minio:
