services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  minio:
    # Multi-arch Silo release pinned to its manifest-list digest.
    # See docs/integration-test-images.md for the update process.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/silo", "healthcheck", "ready"]
      interval: 2s
      timeout: 5s
      retries: 5

  createbucket:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mcli alias set local http://minio:9000 minioadmin minioadmin;
      mcli mb local/streambed --ignore-existing;
      exit 0;
      "

  streambed:
    profiles: ["streambed"]
    image: streambed:dev
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    environment:
      STREAMBED_SOURCE_URL: postgres://postgres:test@postgres:5432/postgres
      STREAMBED_S3_BUCKET: streambed
      STREAMBED_S3_ENDPOINT: http://minio:9000
      STREAMBED_S3_PREFIX: test
      STREAMBED_S3_REGION: us-east-1
      STREAMBED_QUERY_ADDR: :5433
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - streambed-state:/var/lib/streambed
    ports:
      - "5433:5433"
    restart: unless-stopped
    command: ["sync"]

volumes:
  postgres-data:
  minio-data:
  streambed-state:
